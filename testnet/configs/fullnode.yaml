# Movement Network Testnet - Public Fullnode Configuration
# Download genesis files from the parent directory (testnet/):
#   - genesis.blob
#   - waypoint.txt
#   - genesis_waypoint.txt

base:
  role: "full_node"
  data_dir: "/opt/aptos/data"
  waypoint:
    from_file: "/opt/aptos/waypoint.txt"

execution:
  genesis_file_location: "/opt/aptos/genesis.blob"
  genesis_waypoint:
    from_file: "/opt/aptos/genesis_waypoint.txt"

storage:
  rocksdb_configs:
    enable_storage_sharding: false

full_node_networks:
  - network_id: "public"
    discovery_method: "onchain"
    listen_address: "/ip4/0.0.0.0/tcp/6182"
    seeds:
      87d46ec39f5b359cf510bbcfad64746869f08a71aafabcca3ae6203de70cc3ca:
        addresses:
          - "/dns/vfn-02.nodes.testnet.movementnetwork.xyz/tcp/6182/noise-ik/0x9264dad024936304469b904b8c80366246dff8121de2cfa4cacad96d67b85f06/handshake/0"
        role: "Upstream"

api:
  enabled: true
  address: 0.0.0.0:8080

state_sync:
  state_sync_driver:
    bootstrapping_mode: DownloadLatestStates
    continuous_syncing_mode: ApplyTransactionOutputs
